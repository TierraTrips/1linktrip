# Page names (https://1linktrip.com/<name>): keeps 404.html and the per-name link-preview pages (<name>.html) in step with
# index.html and with the names organizers choose. See .github/names.mjs. Uses only public data and this repo's own token.
name: Page names
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: page-names
  cancel-in-progress: false
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Write 404.html and <name>.html
        run: node .github/names.mjs
      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name '1LinkTrip names'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.html'
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -q -m 'Page names: link-preview pages'
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              # a push made with this token may not start a Pages build by itself: ask for one
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${{ github.repository }}/pages/builds" >/dev/null || echo 'pages build request failed (the push may start one anyway)'
              exit 0
            fi
            sleep $((i * 3))
            git fetch -q origin main && git reset -q --hard origin/main && node .github/names.mjs && git add -A -- '*.html'
            if git diff --cached --quiet; then echo 'nothing changed after sync'; exit 0; fi
            git commit -q -m 'Page names: link-preview pages'
          done
          exit 1
